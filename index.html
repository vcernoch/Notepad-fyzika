<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fyzikální sešit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Layout: school exercise book — note list | squared paper with red margin | symbol drawer */
:root {
  --paper: #f6f7fa;
  --sheet: #fdfdfe;
  --ink: #1a2030;
  --muted: #5d6679;
  --line: #dde2ec;
  --grid: #e6ebf4;
  --accent: #2440b8;
  --accent-soft: #e5e9fa;
  --margin: #d2503f;
  --chip: #eef1f7;
  --font-math: "STIX Two Text", "Cambria Math", "Noto Sans Math", "Times New Roman", serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --row: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151c; --sheet: #181c25; --ink: #e3e7f0; --muted: #98a1b3;
    --line: #2a303d; --grid: #222835; --accent: #93a6ff; --accent-soft: #232c4d;
    --margin: #d86d5f; --chip: #212633; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #181c25; --ink: #e3e7f0; --muted: #98a1b3;
  --line: #2a303d; --grid: #222835; --accent: #93a6ff; --accent-soft: #232c4d;
  --margin: #d86d5f; --chip: #212633; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 14px/1.45 var(--font-ui);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%; display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 220px minmax(0, 1fr) 340px;
  grid-template-areas: "top top top" "notes editor drawer";
}

/* Top bar */
.top {
  grid-area: top; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--sheet);
}
.brand { font-family: var(--font-math); font-style: italic; font-size: 22px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.title-input {
  flex: 1 1 200px; min-width: 0; border: 1px solid transparent; background: transparent;
  padding: 6px 10px; border-radius: 6px; font-size: 16px; font-weight: 500;
}
.title-input:hover { border-color: var(--line); }
.title-input:focus { border-color: var(--accent); outline: none; background: var(--paper); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--sheet); padding: 6px 12px; border-radius: 6px;
  font-size: 13px; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.primary:hover { filter: brightness(1.08); color: var(--sheet); }
.btn.danger { color: var(--margin); }
.btn.danger:hover { border-color: var(--margin); }
.notes-toggle { display: none; }

/* Notes list */
.notes { grid-area: notes; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.notes-search { margin: 12px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); }
.note-list { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1; }
.note-list li button {
  width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px;
  display: grid; gap: 2px;
}
.note-list li button:hover { background: var(--chip); }
.note-list li button[aria-current="true"] { background: var(--accent-soft); }
.note-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Editor */
.editor-wrap { grid-area: editor; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.editor {
  flex: 1; min-height: 0; width: 100%; resize: none; border: 0; outline: none;
  padding: 0 24px var(--row) 64px;
  font-family: var(--font-math); font-size: 21px; line-height: var(--row);
  color: var(--ink); background-color: var(--sheet); tab-size: 4;
  background-image:
    linear-gradient(90deg, transparent 47px, var(--margin) 47px, var(--margin) 48px, transparent 48px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, var(--row) var(--row), var(--row) var(--row);
  background-attachment: local;
}
.editor::placeholder { color: var(--muted); font-style: italic; }
.status {
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 6px 16px;
  border-top: 1px solid var(--line); background: var(--sheet); font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.status label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.pill { padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.pill.on { background: var(--accent); color: var(--sheet); }
.spacer { flex: 1; }

/* Drawer */
.drawer { grid-area: drawer; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--paper); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 12px 8px; }
.tab {
  border: 1px solid var(--line); background: transparent; padding: 4px 10px; border-radius: 99px; font-size: 12.5px;
}
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.panel { overflow-y: auto; padding: 4px 12px 16px; flex: 1; min-height: 0; }
.group-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
.sym {
  border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 5px 2px 3px;
  display: grid; justify-items: center; gap: 1px; min-height: 44px;
}
.sym:hover { border-color: var(--accent); background: var(--accent-soft); }
.sym b { font-family: var(--font-math); font-weight: 400; font-size: 20px; line-height: 1.2; }
.sym small { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.tool {
  border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 8px 10px;
  display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
}
.tool:hover { border-color: var(--accent); }
.tool.on { border-color: var(--accent); background: var(--accent-soft); }
.tool b { font-family: var(--font-math); font-weight: 400; font-size: 22px; min-width: 32px; text-align: center; }
.tool span { display: grid; }
.tool small { color: var(--muted); font-size: 12px; }
.tools { display: grid; gap: 6px; }
.formula {
  width: 100%; text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px;
  padding: 7px 10px; display: grid; gap: 1px;
}
.formula:hover { border-color: var(--accent); }
.formula b { font-family: var(--font-math); font-weight: 400; font-size: 18px; }
.formula small { color: var(--muted); font-size: 12px; }
.formulas { display: grid; gap: 4px; }
.keys { width: 100%; border-collapse: collapse; font-size: 13px; }
.keys td { padding: 5px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.keys td:first-child { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; color: var(--accent); }
.keys td:last-child { font-family: var(--font-math); font-size: 17px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 8px 0; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 6px; font-size: 13px;
}

@media (max-width: 1080px) {
  .app { grid-template-columns: 200px minmax(0, 1fr) 290px; }
}
@media (max-width: 820px) {
  html, body { height: auto; }
  .app {
    height: auto; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto auto;
    grid-template-areas: "top" "notes" "editor" "drawer";
  }
  .notes-toggle { display: inline-block; }
  .notes { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
  .notes.collapsed { display: none; }
  .editor-wrap { height: 55vh; min-height: 300px; }
  .editor { padding-left: 52px; font-size: 19px; background-image:
    linear-gradient(90deg, transparent 39px, var(--margin) 39px, var(--margin) 40px, transparent 40px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px); }
  .drawer { border-left: 0; border-top: 1px solid var(--line); }
  .panel { max-height: 50vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Fyzikální <span>sešit</span></div>
    <button class="btn notes-toggle" id="notesToggle" type="button">Poznámky</button>
    <input class="title-input" id="title" type="text" placeholder="Název poznámky" aria-label="Název poznámky">
    <div class="actions">
      <button class="btn primary" id="newNote" type="button">+ Nová</button>
      <button class="btn" id="copyNote" type="button">Kopírovat text</button>
      <button class="btn danger" id="deleteNote" type="button">Smazat</button>
      <button class="btn danger" id="confirmDelete" type="button" hidden>Opravdu smazat?</button>
    </div>
  </header>

  <aside class="notes collapsed" id="notes">
    <input class="notes-search" id="search" type="search" placeholder="Hledat v poznámkách" aria-label="Hledat v poznámkách">
    <ul class="note-list" id="noteList"></ul>
  </aside>

  <main class="editor-wrap">
    <textarea class="editor" id="editor" spellcheck="false" aria-label="Text poznámky"
      placeholder="Piš vzorce… např. F = m·a,  v_0 → v₀,  x^2 → x²,  \alpha → α"></textarea>
    <div class="status">
      <span id="stats">0 znaků</span>
      <span>Režim: <span class="pill" id="modePill">normální</span></span>
      <label><input type="checkbox" id="autoFix" checked> Automatické převody</label>
      <span class="spacer"></span>
      <span id="saved">Uloženo</span>
    </div>
  </main>

  <aside class="drawer">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="panel" id="panel"></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';

/* ---------- Symbol maps ---------- */
const SUP = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹',

  'f':'ᶠ','g':'ᵍ','h':'ʰ','j':'ʲ','k':'ᵏ','l':'ˡ','m':'ᵐ','o':'ᵒ','p':'ᵖ','r':'ʳ','s':'ˢ','t':'ᵗ',
  'u':'ᵘ','v':'ᵛ','w':'ʷ','x':'ˣ','y':'ʸ','z':'ᶻ','T':'ᵀ' };

  'Mimo SI': ['°C','eV','l','h','min','Å','u','atm','bar','kWh','t','°'],
  'Předpony': ['p','n','µ','m','c','d','k','M','G','T']

const PREFIX_HINT = { p:'10⁻¹²', n:'10⁻⁹', 'µ':'10⁻⁶', m:'10⁻³', c:'10⁻²', d:'10⁻¹', k:'10³', M:'10⁶', G:'10⁹', T:'10¹²' };

const CONSTANTS = [
  ['c = 3,00·10⁸ m·s⁻¹', 'rychlost světla ve vakuu'],
  ['g = 9,81 m·s⁻²', 'tíhové zrychlení'],

  ['mₑ = 9,109·10⁻³¹ kg', 'hmotnost elektronu'],

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.notes) && data.notes.length) return data;
    }
  } catch (e) { /* storage unavailable */ }
  return { notes: [SAMPLE], current: SAMPLE.id };
}
let state = load();
let saveTimer = null;
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); savedEl.textContent = 'Uloženo'; }
  catch (e) { savedEl.textContent = 'Nelze uložit (úložiště prohlížeče je vypnuté)'; }
}
function scheduleSave() {
  savedEl.textContent = 'Ukládám…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 400);
}

/* ---------- Elements ---------- */
const $ = id => document.getElementById(id);
const ed = $('editor'), titleEl = $('title'), listEl = $('noteList'), searchEl = $('search');
const savedEl = $('saved'), statsEl = $('stats'), modePill = $('modePill'), autoFix = $('autoFix');
const tabsEl = $('tabs'), panelEl = $('panel'), toastEl = $('toast');

const current = () => state.notes.find(n => n.id === state.current) || state.notes[0];
const noteName = n => n.title.trim() || (n.body.split('\n').find(l => l.trim()) || 'Bez názvu').slice(0, 40);

function renderList() {
  const q = searchEl.value.trim().toLowerCase();
  const notes = [...state.notes].sort((a, b) => b.updated - a.updated)
    .filter(n => !q || (n.title + ' ' + n.body).toLowerCase().includes(q));
  listEl.innerHTML = '';
  notes.forEach(n => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-current', n.id === state.current ? 'true' : 'false');
    const name = document.createElement('span'); name.className = 'note-name'; name.textContent = noteName(n);
    const meta = document.createElement('span'); meta.className = 'note-meta';
    meta.textContent = new Date(n.updated).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
    b.append(name, meta);
    b.addEventListener('click', () => { openNote(n.id); if (matchMedia('(max-width: 820px)').matches) $('notes').classList.add('collapsed'); });
    li.append(b); listEl.append(li);
  });
  if (!notes.length) {
    const li = document.createElement('li'); li.className = 'hint'; li.style.padding = '8px 10px';
    li.textContent = 'Nic nenalezeno.'; listEl.append(li);
  }
}
function openNote(id) {
  state.current = id;
  const n = current();
  ed.value = n.body; titleEl.value = n.title;
  resetModes(); renderList(); updateStats(); persist();
  hideConfirm();
}
function touch() {
  const n = current(); n.body = ed.value; n.title = titleEl.value; n.updated = Date.now();
  updateStats(); scheduleSave(); renderList();
}
function updateStats() {
  const chars = Array.from(ed.value.normalize('NFC')).length;
  const lines = ed.value ? ed.value.split('\n').length : 0;
  statsEl.textContent = `${chars} znaků · ${lines} řádků`;
}

/* ---------- Editing primitives ---------- */
let busy = false;
function replaceRange(start, end, text) {
  busy = true;
  ed.focus();
  ed.setSelectionRange(start, end);
  let ok = false;
  try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
  if (!ok || ed.value.slice(start, start + text.length) !== text) {
    ed.setRangeText(text, start, end, 'end');
  }
  busy = false;
  touch();
}
function insert(text) {
  replaceRange(ed.selectionStart, ed.selectionEnd, text);
}

/* Modes: 'sup' / 'sub' typed conversion. auto = started by ^ or _ and ends on first non-convertible char */
let mode = null, modeAuto = false, pendingComb = null;
function setMode(m, auto = false) {
  mode = m; modeAuto = auto;
  modePill.textContent = m === 'sup' ? 'horní index x²' : m === 'sub' ? 'dolní index x₂' : pendingComb ? 'čeká na znak' : 'normální';
  modePill.classList.toggle('on', !!m || !!pendingComb);
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
}
function setPending(c) { pendingComb = c; setMode(null); }
function resetModes() { pendingComb = null; setMode(null); }

const isLetter = ch => /\p{L}/u.test(ch);

ed.addEventListener('beforeinput', e => {
  if (busy) return;
  if (e.inputType !== 'insertText' || !e.data || Array.from(e.data).length !== 1) {
    if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') resetModes();
    return;
  }
  const ch = e.data;
  const s = ed.selectionStart, end = ed.selectionEnd;

  if (pendingComb) {
    const c = pendingComb; pendingComb = null; setMode(null);
    if (ch === ' ') return;
    e.preventDefault(); replaceRange(s, end, ch + c); return;
  }
  if (mode) {
    const map = mode === 'sup' ? SUP : SUB;
    if (map[ch]) { e.preventDefault(); replaceRange(s, end, map[ch]); return; }
    if (modeAuto) setMode(null); else return;
  }
  if (!autoFix.checked || s !== end) return;

  const before = ed.value.slice(0, s);
  const prev = before.slice(-1);

  // x^2 → x², v_0 → v₀ (continues while characters are convertible)
  if ((prev === '^' && SUP[ch]) || (prev === '_' && SUB[ch])) {
    const sup = prev === '^';
    e.preventDefault();
    replaceRange(s - 1, s, (sup ? SUP : SUB)[ch]);
    setMode(sup ? 'sup' : 'sub', true);
    return;
  }
  // \alpha, \vec … finished by a non-letter
  if (!/[A-Za-z]/.test(ch)) {
    const m = before.match(/\\([A-Za-z]+)$/);
    if (m && (CMD[m[1]] || COMB[m[1]])) {
      e.preventDefault();
      const from = s - m[0].length;
      if (COMB[m[1]]) {
        replaceRange(from, s, '');
        setPending(COMB[m[1]]);
        if (ch !== ' ') { replaceRange(from, from, ch + COMB[m[1]]); resetModes(); }
      } else {
        replaceRange(from, s, CMD[m[1]] + ch);
      }
      return;
    }
  }
  const pair = PAIRS[prev + ch];
  if (pair) { e.preventDefault(); replaceRange(s - 1, s, pair); return; }
  if (ch === '*') { e.preventDefault(); replaceRange(s, s, '·'); return; }
});

ed.addEventListener('input', () => { if (!busy) touch(); });
ed.addEventListener('mousedown', () => { if (modeAuto) setMode(null); });
ed.addEventListener('keydown', e => {
  if (e.altKey && !e.ctrlKey && !e.metaKey) {
    if (e.key === 'ArrowUp') { e.preventDefault(); setMode(mode === 'sup' ? null : 'sup'); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); setMode(mode === 'sub' ? null : 'sub'); return; }
    if (e.code === 'KeyV') { e.preventDefault(); applyCombining(COMB.vec); return; }
    if (e.code === 'KeyB') { e.preventDefault(); applyBold(); return; }
  }
  if (e.key === 'Escape') { resetModes(); return; }
  if (e.key === 'Tab') { e.preventDefault(); insert('\t'); return; }
  if (modeAuto && /^(Arrow|Home|End|Page)/.test(e.key)) setMode(null);
});

/* Vector arrow / hat / dot over the selection or the character before the cursor */
function applyCombining(c) {
  const s = ed.selectionStart, end = ed.selectionEnd;
  if (s !== end) {
    const sel = ed.value.slice(s, end).replace(/[̀-ͯ⃐-⃿]/g, '');
    replaceRange(s, end, sel + c);
    return;
  }
  const before = ed.value.slice(0, s);
  const chars = Array.from(before);
  const last = chars[chars.length - 1];
  if (last && isLetter(last)) {
    replaceRange(s - last.length, s, last + c);
  } else {
    setPending(c);
    ed.focus();
    toast('Napiš písmeno, dostane značku nad sebe');
  }
}
function toBold(str) {
  return Array.from(str).map(ch => {
    const code = ch.codePointAt(0);
    if (code >= 65 && code <= 90) return String.fromCodePoint(0x1D400 + code - 65);
    if (code >= 97 && code <= 122) return String.fromCodePoint(0x1D41A + code - 97);
    if (code >= 48 && code <= 57) return String.fromCodePoint(0x1D7CE + code - 48);
    return ch;
  }).join('');
}
function applyBold() {
  const s = ed.selectionStart, end = ed.selectionEnd;
  if (s !== end) { replaceRange(s, end, toBold(ed.value.slice(s, end))); return; }
  const chars = Array.from(ed.value.slice(0, s));
  const last = chars[chars.length - 1];
  if (last && /[A-Za-z]/.test(last)) replaceRange(s - 1, s, toBold(last));
  else toast('Označ text nebo napiš písmeno, které má být tučně');
}
function convertSelection(map) {
  const s = ed.selectionStart, end = ed.selectionEnd;
  if (s === end) return false;
  replaceRange(s, end, Array.from(ed.value.slice(s, end)).map(c => map[c] || c).join(''));
  return true;
}

/* ---------- Drawer ---------- */
function symButton(sym, hint, title) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'sym'; b.title = title || (hint ? `${sym}  (${hint})` : sym);
  const big = document.createElement('b'); big.textContent = sym;
  b.append(big);
  if (hint) { const sm = document.createElement('small'); sm.textContent = hint; b.append(sm); }
  b.addEventListener('mousedown', e => e.preventDefault());
  b.addEventListener('click', () => insert(sym));
  return b;
}
function label(text) { const d = document.createElement('div'); d.className = 'group-label'; d.textContent = text; return d; }
function grid(items, wide) { const g = document.createElement('div'); g.className = 'grid' + (wide ? ' wide' : ''); items.forEach(i => g.append(i)); return g; }
function tool(sym, name, desc, onClick, modeName) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tool';
  if (modeName) b.dataset.mode = modeName;
  b.innerHTML = '<b></b><span><strong></strong><small></small></span>';
  b.querySelector('b').textContent = sym;
  b.querySelector('strong').textContent = name;
  b.querySelector('small').textContent = desc;
  b.addEventListener('mousedown', e => e.preventDefault());
  b.addEventListener('click', onClick);
  return b;
}
function formulaList(items) {
  const wrap = document.createElement('div'); wrap.className = 'formulas';
  items.forEach(([f, d]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'formula';
    const big = document.createElement('b'); big.textContent = f;
    const sm = document.createElement('small'); sm.textContent = d;
    b.append(big, sm);
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => {
      const s = ed.selectionStart;
      const atLineStart = s === 0 || ed.value[s - 1] === '\n';
      insert((atLineStart ? '' : '\n') + f + '\n');
    });
    wrap.append(b);
  });
  return wrap;
}

const TABS = {
  'Řecká': () => [
    label('Malá písmena'), grid(GREEK.slice(0, 25).map(([k, v]) => symButton(v, '\\' + k))),
    label('Velká písmena'), grid(GREEK.slice(25).map(([k, v]) => symButton(v, '\\' + k)))
  ],
  'Operátory': () => [
    label('Operace a relace'), grid(OPS.slice(0, 15).map(([k, v]) => symButton(v, '\\' + k))),
    label('Analýza'), grid(OPS.slice(15, 25).map(([k, v]) => symButton(v, '\\' + k))),
    label('Šipky, úhly a ostatní'), grid(OPS.slice(25).map(([k, v]) => symButton(v, '\\' + k)))
  ],
  'Indexy': () => {
    const hint = document.createElement('p'); hint.className = 'hint';
    hint.textContent = 'Zapnutý režim převádí psané znaky. Označený text převede tlačítko hned. Rychleji: x^2 → x², v_0 → v₀.';
    return [
      hint,
      label('Režim psaní'),
      (() => { const t = document.createElement('div'); t.className = 'tools';
        t.append(
          tool('x²', 'Horní index', 'Alt + ↑, nebo napiš ^', () => { if (!convertSelection(SUP)) setMode(mode === 'sup' ? null : 'sup'); ed.focus(); }, 'sup'),
          tool('x₂', 'Dolní index', 'Alt + ↓, nebo napiš _', () => { if (!convertSelection(SUB)) setMode(mode === 'sub' ? null : 'sub'); ed.focus(); }, 'sub')
        ); return t; })(),
      label('Horní indexy'), grid(Object.values(SUP).slice(0, 17).map(v => symButton(v))),
      label('Dolní indexy'), grid(Object.values(SUB).map(v => symButton(v))),
      label('Mocniny deseti'), grid(['10³','10⁶','10⁹','10⁻³','10⁻⁶','10⁻⁹','10⁻¹²','·10'].map(v => symButton(v)), true)
    ];
  },
  'Vektory': () => {
    const t = document.createElement('div'); t.className = 'tools';
    t.append(
      tool('v⃗', 'Šipka nad písmenem', 'Alt + V, nebo \\vec a písmeno', () => applyCombining(COMB.vec)),
      tool('𝐅', 'Tučný vektor', 'Alt + B na označený text', applyBold),
      tool('x̂', 'Stříška (jednotkový vektor)', '\\hat a písmeno', () => applyCombining(COMB.hat)),
      tool('x̄', 'Pruh (střední hodnota)', '\\bar a písmeno', () => applyCombining(COMB.bar)),
      tool('ẋ', 'Tečka (časová derivace)', '\\dot a písmeno', () => applyCombining(COMB.dot)),
      tool('ẍ', 'Dvě tečky (druhá derivace)', '\\ddot a písmeno', () => applyCombining(COMB.ddot))
    );
    return [
      label('Značky nad písmeno'), t,
      label('Časté vektory'), grid(['F⃗','v⃗','a⃗','p⃗','r⃗','s⃗','E⃗','B⃗','M⃗','L⃗','ω⃗','g⃗'].map(v => symButton(v))),
      label('Jednotkové vektory a operace'), grid(['î','ĵ','k̂','×','·','|v⃗|','∇','⊥','∥'].map(v => symButton(v)))
    ];
  },
  'Jednotky': () => Object.entries(UNITS).flatMap(([name, list]) => [
    label(name),
    grid(list.map(u => symButton(u, name === 'Předpony' ? PREFIX_HINT[u] : '')), name === 'Složené')
  ]),
  'Konstanty': () => [label('Fyzikální konstanty'), formulaList(CONSTANTS)],
  'Vzorce': () => Object.entries(FORMULAS).flatMap(([name, list]) => [label(name), formulaList(list)]),
  'Zkratky': () => {
    const rows = [
      ['x^2', 'x²'], ['10^-11', '10⁻¹¹'], ['v_0', 'v₀'], ['F_max', 'Fₘₐₓ'], ['\\alpha', 'α'], ['\\Delta', 'Δ'],
      ['\\vec F', 'F⃗'], ['\\hat x', 'x̂'], ['\\dot x', 'ẋ'], ['\\sqrt', '√'], ['\\deg', '°'], ['\\inf', '∞'],
      ['\\hbar', 'ħ'], ['\\micro', 'µ'], ['\\Ohm', 'Ω'], ['a*b', 'a·b'], ['->', '→'], ['=>', '⇒'],
      ['<=  >=', '≤  ≥'], ['!=', '≠'], ['~=', '≈'], ['+-', '±'],
      ['Alt + ↑ / ↓', 'horní / dolní index'], ['Alt + V', 'šipka nad písmenem'], ['Alt + B', 'tučně'], ['Esc', 'zruší režim']
    ];
    const tbl = document.createElement('table'); tbl.className = 'keys';
    rows.forEach(([k, v]) => { const tr = tbl.insertRow(); tr.insertCell().textContent = k; tr.insertCell().textContent = v; });
    const p = document.createElement('p'); p.className = 'hint';
    p.textContent = 'Příkaz se zobrazí po mezeře nebo jiném znaku. Všechny názvy řeckých písmen fungují jako v LaTeXu (\\omega, \\Phi…). Text je obyčejný Unicode, takže jde zkopírovat do Wordu, e-mailu i chatu.';
    return [label('Při psaní'), tbl, p];
  }
};

let activeTab = 'Řecká';
try { activeTab = localStorage.getItem(KEY + '-tab') || activeTab; } catch (e) {}
if (!TABS[activeTab]) activeTab = 'Řecká';
function renderTabs() {
  tabsEl.innerHTML = '';
  Object.keys(TABS).forEach(name => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.role = 'tab'; b.textContent = name;
    b.setAttribute('aria-selected', name === activeTab ? 'true' : 'false');
    b.addEventListener('click', () => {
      activeTab = name;
      try { localStorage.setItem(KEY + '-tab', name); } catch (e) {}
      renderTabs();
    });
    tabsEl.append(b);
  });
  panelEl.innerHTML = '';
  TABS[activeTab]().forEach(el => panelEl.append(el));
  setMode(mode, modeAuto);
}

/* ---------- Top bar ---------- */
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 2200);
}
function hideConfirm() { $('confirmDelete').hidden = true; $('deleteNote').hidden = false; }

$('newNote').addEventListener('click', () => {
  const n = { id: 'n' + Date.now().toString(36), title: '', body: '', updated: Date.now() };
  state.notes.push(n); openNote(n.id); titleEl.focus();
});
$('copyNote').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(ed.value); toast('Text zkopírován'); }
  catch (e) { ed.focus(); ed.select(); toast('Text je označený, zkopíruj ho Ctrl + C'); }
});
$('deleteNote').addEventListener('click', () => { $('deleteNote').hidden = true; $('confirmDelete').hidden = false; $('confirmDelete').focus(); });
$('confirmDelete').addEventListener('blur', () => setTimeout(hideConfirm, 150));
$('confirmDelete').addEventListener('click', () => {
  state.notes = state.notes.filter(n => n.id !== state.current);
  if (!state.notes.length) state.notes.push({ id: 'n' + Date.now().toString(36), title: '', body: '', updated: Date.now() });
  const next = [...state.notes].sort((a, b) => b.updated - a.updated)[0];
  openNote(next.id); toast('Poznámka smazána');
});
$('notesToggle').addEventListener('click', () => $('notes').classList.toggle('collapsed'));
titleEl.addEventListener('input', touch);
searchEl.addEventListener('input', renderList);

if (matchMedia('(min-width: 821px)').matches) $('notes').classList.remove('collapsed');
renderTabs();
openNote(current().id);
})();
</script>
